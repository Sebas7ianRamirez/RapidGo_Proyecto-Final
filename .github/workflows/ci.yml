name: CI RapidGo

run-name: CI ejecutado por ${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis Python
        run: python -m compileall producer spark tests

      - name: Instalar Apache Airflow
        run: pip install apache-airflow==3.3.1 pandas pyarrow

      - name: Validar DAG de Airflow con DagBag
        run: |
          python -c "
          from airflow.models import DagBag
          db = DagBag(dag_folder='airflow/dags')
          assert db.import_errors == {}, db.import_errors
          print('DAGs cargados correctamente:', list(db.dags.keys()))
          "

      - name: Ejecutar pruebas
        run: pytest -v

      - name: Validar Docker Compose
        run: docker compose config --quiet

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: validar
    if: always()
    steps:
      - name: Evaluar resultado del CI
        run: |
          if [ "${{ needs.validar.result }}" != "success" ]; then
            echo "Quality Gate RECHAZADO: el CI falló. No se debe crear el tag v1.0.0."
            exit 1
          fi
          echo "Quality Gate APROBADO: se puede crear el tag v1.0.0."
